<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="280" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#101828">A loader that feels alive, not stalled</text>
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#667085">The &quot;reaching out to connect&quot; feel: ripples pulsing outward while the app does real work.</text>

  <g transform="translate(430,172)">
    <!-- expanding ripple rings, staggered, four Google colours -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#4285F4" stroke-width="4">
      <animate attributeName="r" values="18;74" dur="2.2s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="stroke" values="#4285F4;#0F9D58" dur="2.2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#DB4437" stroke-width="4">
      <animate attributeName="r" values="18;74" dur="2.2s" repeatCount="indefinite" begin="0.55s"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite" begin="0.55s"/>
      <animate attributeName="stroke" values="#DB4437;#F4B400" dur="2.2s" repeatCount="indefinite" begin="0.55s"/>
    </circle>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#F4B400" stroke-width="4">
      <animate attributeName="r" values="18;74" dur="2.2s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="stroke" values="#F4B400;#4285F4" dur="2.2s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#0F9D58" stroke-width="4">
      <animate attributeName="r" values="18;74" dur="2.2s" repeatCount="indefinite" begin="1.65s"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite" begin="1.65s"/>
      <animate attributeName="stroke" values="#0F9D58;#DB4437" dur="2.2s" repeatCount="indefinite" begin="1.65s"/>
    </circle>

    <!-- breathing core dot that cycles the four colours -->
    <circle cx="0" cy="0" r="14" fill="#4285F4">
      <animate attributeName="r" values="12;16;12" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#4285F4;#DB4437;#F4B400;#0F9D58;#4285F4" dur="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
