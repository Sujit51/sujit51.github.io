<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="260" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="430" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#101828">A loader that feels alive, not stalled</text>
  <text x="430" y="64" text-anchor="middle" font-size="13" fill="#667085">Inspired by Material 3's expressive loading indicator: a shape that morphs and cycles colour while it waits.</text>

  <!-- morphing, color-cycling, rotating loader -->
  <g transform="translate(430,160)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
      <path d="M0,-46 C25,-46 46,-25 46,0 C46,25 25,46 0,46 C-25,46 -46,25 -46,0 C-46,-25 -25,-46 0,-46 Z" fill="#4285F4">
        <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
          values="
          M0,-46 C25,-46 46,-25 46,0 C46,25 25,46 0,46 C-25,46 -46,25 -46,0 C-46,-25 -25,-46 0,-46 Z;
          M0,-50 C30,-40 40,-30 50,0 C40,30 30,40 0,50 C-30,40 -40,30 -50,0 C-40,-30 -30,-40 0,-50 Z;
          M0,-40 C20,-48 48,-20 40,0 C48,20 20,48 0,40 C-20,48 -48,20 -40,0 C-48,-20 -20,-48 0,-40 Z;
          M0,-46 C25,-46 46,-25 46,0 C46,25 25,46 0,46 C-25,46 -46,25 -46,0 C-46,-25 -25,-46 0,-46 Z"/>
        <animate attributeName="fill" dur="4.8s" repeatCount="indefinite"
          values="#4285F4; #DB4437; #F4B400; #0F9D58; #4285F4"/>
      </path>
    </g>
  </g>
</svg>
