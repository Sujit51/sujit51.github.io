<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="320" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#101828">Skeleton lifecycle: in almost instantly, out just in time</text>

  <!-- markers -->
  <line x1="150" y1="70" x2="150" y2="248" stroke="#2f6fed" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="150" y="64" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2f6fed">navigation starts</text>

  <line x1="660" y1="70" x2="660" y2="248" stroke="#067647" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="660" y="64" text-anchor="middle" font-size="12.5" font-weight="600" fill="#067647">real content paints</text>

  <!-- Before row -->
  <text x="40" y="112" font-size="13" font-weight="600" fill="#b42318">Before</text>
  <rect x="150" y="96" width="560" height="28" rx="6" fill="#fde7e7"/>
  <text x="430" y="115" text-anchor="middle" font-size="12.5" fill="#b42318">blank grey screen the whole wait</text>

  <!-- After row -->
  <text x="40" y="170" font-size="13" font-weight="600" fill="#067647">After</text>
  <rect x="150" y="154" width="510" height="28" rx="6" fill="#d1fadf"/>
  <text x="405" y="173" text-anchor="middle" font-size="12.5" fill="#067647">skeleton visible (shows in &lt; 1 frame)</text>
  <rect x="660" y="154" width="86" height="28" rx="6" fill="#fff4cc"/>
  <text x="703" y="173" text-anchor="middle" font-size="11.5" fill="#8a6d00">fade 200ms</text>

  <!-- time axis -->
  <line x1="60" y1="222" x2="900" y2="222" stroke="#98a2b3" stroke-width="2"/>
  <polygon points="900,222 889,217 889,227" fill="#98a2b3"/>
  <text x="900" y="244" text-anchor="end" font-size="12" fill="#667085">time after tap →</text>

  <!-- API labels -->
  <g font-size="12">
    <text x="150" y="276" text-anchor="middle" fill="#344054">show trigger</text>
    <text x="150" y="296" text-anchor="middle" font-weight="600" fill="#101828" font-family="JetBrains Mono, monospace">didStartProvisionalNavigation</text>
    <text x="660" y="276" text-anchor="middle" fill="#344054">hide on first-paint signal</text>
    <text x="660" y="296" text-anchor="middle" font-weight="600" fill="#101828" font-family="JetBrains Mono, monospace">fallback: didFinish / didFail</text>
  </g>
</svg>
