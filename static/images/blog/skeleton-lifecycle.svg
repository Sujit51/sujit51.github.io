<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="330" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#101828">Skeleton lifecycle: in almost instantly, out just in time</text>

  <!-- time axis -->
  <line x1="60" y1="250" x2="800" y2="250" stroke="#98a2b3" stroke-width="2"/>
  <polygon points="800,250 790,245 790,255" fill="#98a2b3"/>
  <text x="800" y="272" text-anchor="end" font-size="12" fill="#667085">time after tap →</text>

  <!-- t0 marker: navigation starts -->
  <line x1="110" y1="80" x2="110" y2="258" stroke="#2f6fed" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="110" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6fed">navigation starts</text>

  <!-- first-paint marker -->
  <line x1="610" y1="80" x2="610" y2="258" stroke="#067647" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="610" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#067647">real content paints</text>

  <!-- Row A: blank (old) -->
  <text x="60" y="118" font-size="13" font-weight="600" fill="#b42318">Before</text>
  <rect x="110" y="104" width="560" height="26" rx="5" fill="#fde7e7"/>
  <text x="390" y="122" text-anchor="middle" font-size="12" fill="#b42318">blank grey screen the whole wait</text>

  <!-- Row B: skeleton -->
  <text x="60" y="170" font-size="13" font-weight="600" fill="#067647">After</text>
  <rect x="110" y="156" width="490" height="26" rx="5" fill="#d1fadf"/>
  <text x="355" y="174" text-anchor="middle" font-size="12" fill="#067647">skeleton visible (shows in &lt; 1 frame)</text>
  <rect x="600" y="156" width="70" height="26" rx="5" fill="#fff4cc"/>
  <text x="635" y="174" text-anchor="middle" font-size="11" fill="#8a6d00">fade 200ms</text>

  <!-- API labels under axis -->
  <g font-size="12">
    <text x="110" y="300" text-anchor="middle" fill="#344054">show on</text>
    <text x="110" y="316" text-anchor="middle" font-weight="600" fill="#101828" font-family="JetBrains Mono, monospace">didStartProvisionalNavigation</text>
    <text x="610" y="300" text-anchor="middle" fill="#344054">hide on first-paint signal</text>
    <text x="610" y="316" text-anchor="middle" fill="#344054">fallback: </text>
    <text x="672" y="316" text-anchor="start" font-weight="600" fill="#101828" font-family="JetBrains Mono, monospace">didFinish / didFail</text>
  </g>
</svg>
