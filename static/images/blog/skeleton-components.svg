<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="400" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#101828">The pieces, at a glance</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#667085">Generic component view. New code in one module; the web view and loading overlay are reused as-is.</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
  </defs>
  <style>
    .box{rx:10; stroke-width:2;}
    .lbl{font-size:13px; font-weight:600; fill:#101828;}
    .sub{font-size:11px; fill:#667085;}
    .edge{stroke:#667085; stroke-width:1.6; fill:none; marker-end:url(#arr);}
    .et{font-size:11px; fill:#475467;}
  </style>

  <!-- Screen / VC -->
  <rect x="40" y="110" width="170" height="64" rx="10" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="125" y="138" text-anchor="middle" class="lbl">Screen (view controller)</text>
  <text x="125" y="156" text-anchor="middle" class="sub">hosts the web view</text>

  <!-- Coordinator (NEW) -->
  <rect x="345" y="110" width="190" height="64" rx="10" fill="#e9fbf0" stroke="#067647"/>
  <text x="440" y="132" text-anchor="middle" class="lbl">Skeleton coordinator</text>
  <text x="440" y="150" text-anchor="middle" class="sub">decides show / hide,</text>
  <text x="440" y="165" text-anchor="middle" class="sub">owns the overlay lifecycle</text>

  <!-- Config + asset (NEW) -->
  <rect x="650" y="40" width="175" height="60" rx="10" fill="#e9fbf0" stroke="#067647"/>
  <text x="737" y="66" text-anchor="middle" class="lbl">URL matcher + config</text>
  <text x="737" y="84" text-anchor="middle" class="sub">which pages get a skeleton</text>

  <rect x="650" y="118" width="175" height="60" rx="10" fill="#e9fbf0" stroke="#067647"/>
  <text x="737" y="144" text-anchor="middle" class="lbl">Bundled image asset</text>
  <text x="737" y="162" text-anchor="middle" class="sub">UIImageView skeleton</text>

  <!-- WKWebView -->
  <rect x="345" y="250" width="190" height="64" rx="10" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="440" y="278" text-anchor="middle" class="lbl">WKWebView</text>
  <text x="440" y="296" text-anchor="middle" class="sub">navigation-delegate callbacks</text>

  <!-- Loading overlay (reused) -->
  <rect x="40" y="250" width="170" height="64" rx="10" fill="#f4f0ff" stroke="#7a5af8"/>
  <text x="125" y="278" text-anchor="middle" class="lbl">Loading overlay</text>
  <text x="125" y="296" text-anchor="middle" class="sub">reused; shows skeleton or grey</text>

  <!-- First-paint signal -->
  <rect x="650" y="250" width="175" height="64" rx="10" fill="#fff8e6" stroke="#dc9b00"/>
  <text x="737" y="278" text-anchor="middle" class="lbl">First-paint signal</text>
  <text x="737" y="296" text-anchor="middle" class="sub">"content is on screen now"</text>

  <!-- edges -->
  <path class="edge" d="M210,142 L343,142"/>
  <text x="275" y="134" text-anchor="middle" class="et">asks</text>

  <path class="edge" d="M535,128 L648,78"/>
  <text x="600" y="96" text-anchor="middle" class="et">matches URL</text>
  <path class="edge" d="M535,150 L648,150"/>
  <text x="595" y="166" text-anchor="middle" class="et">builds view from</text>

  <path class="edge" d="M440,250 L440,176"/>
  <text x="490" y="215" text-anchor="middle" class="et">show / hide triggers</text>

  <path class="edge" d="M345,290 L212,290"/>
  <text x="278" y="282" text-anchor="middle" class="et">renders into</text>

  <path class="edge" d="M650,282 L537,282"/>
  <text x="595" y="300" text-anchor="middle" class="et">hide</text>

  <path class="edge" d="M125,250 L125,176"/>
  <text x="125" y="215" text-anchor="middle" class="et">overlay on screen</text>
</svg>
