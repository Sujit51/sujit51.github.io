<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="440" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#101828">The pieces, at a glance</text>
  <text x="480" y="58" text-anchor="middle" font-size="12.5" fill="#667085">Green boxes are new code in one module. The web view and loading overlay are reused as-is.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:14px; font-weight:600; fill:#101828;}
    .sub{font-size:11.5px; fill:#667085;}
    .edge{stroke:#667085; stroke-width:1.8; fill:none; marker-end:url(#arr);}
    .et{font-size:11.5px; font-weight:600; fill:#475467;}
  </style>

  <!-- CONTAINER: Screen (view controller) holds the web view + overlay -->
  <rect x="40" y="90" width="360" height="320" rx="14" fill="#f5f8ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="60" y="116" font-size="14" font-weight="700" fill="#2f6fed">Screen (view controller)</text>
  <text x="60" y="134" font-size="11.5" fill="#667085">hosts the web view and its loading overlay</text>

  <!-- WKWebView (inside) -->
  <rect x="70" y="156" width="300" height="86" rx="11" fill="#eef4ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="220" y="190" text-anchor="middle" class="lbl">WKWebView</text>
  <text x="220" y="210" text-anchor="middle" class="sub">renders the page;</text>
  <text x="220" y="227" text-anchor="middle" class="sub">emits navigation-delegate callbacks</text>

  <!-- Loading overlay (inside, over the web view) -->
  <rect x="70" y="282" width="300" height="86" rx="11" fill="#f4f0ff" stroke="#7a5af8" stroke-width="2"/>
  <text x="220" y="316" text-anchor="middle" class="lbl">Loading overlay</text>
  <text x="220" y="336" text-anchor="middle" class="sub">sits over the web view;</text>
  <text x="220" y="353" text-anchor="middle" class="sub">shows the skeleton or grey</text>

  <!-- Coordinator (NEW) -->
  <rect x="470" y="170" width="230" height="86" rx="12" fill="#e9fbf0" stroke="#067647" stroke-width="2"/>
  <text x="585" y="200" text-anchor="middle" class="lbl">Skeleton coordinator</text>
  <text x="585" y="220" text-anchor="middle" class="sub">decides show / hide,</text>
  <text x="585" y="237" text-anchor="middle" class="sub">owns the overlay lifecycle</text>

  <!-- URL matcher (NEW) -->
  <rect x="740" y="86" width="190" height="72" rx="12" fill="#e9fbf0" stroke="#067647" stroke-width="2"/>
  <text x="835" y="116" text-anchor="middle" class="lbl">URL matcher + config</text>
  <text x="835" y="136" text-anchor="middle" class="sub">which pages get a skeleton</text>

  <!-- Asset (NEW) -->
  <rect x="740" y="178" width="190" height="72" rx="12" fill="#e9fbf0" stroke="#067647" stroke-width="2"/>
  <text x="835" y="208" text-anchor="middle" class="lbl">Bundled image asset</text>
  <text x="835" y="228" text-anchor="middle" class="sub">the UIImageView skeleton</text>

  <!-- First-paint signal -->
  <rect x="470" y="310" width="230" height="72" rx="12" fill="#fff8e6" stroke="#dc9b00" stroke-width="2"/>
  <text x="585" y="340" text-anchor="middle" class="lbl">First-paint signal</text>
  <text x="585" y="360" text-anchor="middle" class="sub">"content is on screen now"</text>

  <!-- edges -->
  <!-- WKWebView callbacks -> coordinator -->
  <path class="edge" d="M370,190 L468,200"/>
  <text x="420" y="183" text-anchor="middle" class="et">callbacks</text>

  <!-- coordinator -> overlay (provides skeleton / show-hide) -->
  <path class="edge" d="M468,240 Q420,300 372,318"/>
  <text x="430" y="300" text-anchor="middle" class="et">show / hide</text>

  <!-- coordinator -> URL matcher -->
  <path class="edge" d="M700,196 L738,150"/>
  <text x="726" y="178" text-anchor="middle" class="et">matches</text>

  <!-- coordinator -> asset -->
  <path class="edge" d="M700,218 L738,214"/>
  <text x="720" y="205" text-anchor="middle" class="et">builds from</text>

  <!-- first-paint -> coordinator -->
  <path class="edge" d="M585,310 L585,258"/>
  <text x="620" y="288" text-anchor="middle" class="et">hide</text>
</svg>
