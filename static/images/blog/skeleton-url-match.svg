<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="300" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#101828">How a page is matched to a skeleton</text>
  <text x="480" y="57" text-anchor="middle" font-size="12.5" fill="#667085">A synchronous check on every navigation. No network, no blocking the load.</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
  </defs>
  <style>
    .lbl2{font-size:13px; font-weight:600; fill:#101828;}
    .sub2{font-size:11px; fill:#667085;}
    .edge2{stroke:#667085; stroke-width:1.8; fill:none; marker-end:url(#a2);}
    .et2{font-size:11.5px; font-weight:600; fill:#475467;}
  </style>

  <!-- 1 URL in -->
  <rect x="30" y="120" width="160" height="66" rx="10" fill="#eef4ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="110" y="148" text-anchor="middle" class="lbl2">Destination URL</text>
  <text x="110" y="167" text-anchor="middle" class="sub2">from the tap</text>

  <!-- 2 canonical key -->
  <rect x="245" y="120" width="190" height="66" rx="10" fill="#f6f7f9" stroke="#98a2b3" stroke-width="2"/>
  <text x="340" y="148" text-anchor="middle" class="lbl2">Reduce to a key</text>
  <text x="340" y="167" text-anchor="middle" class="sub2">strip params, canonical id</text>

  <!-- 3 decision (rounded rect, roomy) -->
  <rect x="490" y="116" width="200" height="74" rx="14" fill="#fff8e6" stroke="#dc9b00" stroke-width="2"/>
  <text x="590" y="146" text-anchor="middle" class="lbl2">Matches a</text>
  <text x="590" y="166" text-anchor="middle" class="lbl2">configured page?</text>

  <!-- 4a yes -->
  <rect x="760" y="74" width="170" height="64" rx="10" fill="#e9fbf0" stroke="#067647" stroke-width="2"/>
  <text x="845" y="101" text-anchor="middle" class="lbl2">Return skeleton</text>
  <text x="845" y="120" text-anchor="middle" class="sub2">for that page type</text>

  <!-- 4b no -->
  <rect x="760" y="168" width="170" height="64" rx="10" fill="#fde7e7" stroke="#b42318" stroke-width="2"/>
  <text x="845" y="195" text-anchor="middle" class="lbl2">Return nil</text>
  <text x="845" y="214" text-anchor="middle" class="sub2">grey fallback, as before</text>

  <!-- edges -->
  <path class="edge2" d="M190,153 L243,153"/>
  <path class="edge2" d="M435,153 L488,153"/>
  <path class="edge2" d="M690,140 L758,112"/>
  <text x="724" y="118" text-anchor="middle" class="et2">yes</text>
  <path class="edge2" d="M690,166 L758,194"/>
  <text x="724" y="190" text-anchor="middle" class="et2">no</text>
</svg>
