<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="300" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#101828">How a page is matched to a skeleton</text>
  <text x="430" y="55" text-anchor="middle" font-size="12" fill="#667085">A synchronous check on every navigation. No network, no blocking the load.</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
  </defs>
  <style>
    .lbl2{font-size:12.5px; font-weight:600; fill:#101828;}
    .sub2{font-size:10.5px; fill:#667085;}
    .edge2{stroke:#667085; stroke-width:1.6; fill:none; marker-end:url(#a2);}
    .et2{font-size:11px; fill:#475467;}
  </style>

  <!-- 1 URL in -->
  <rect x="30" y="120" width="150" height="58" rx="10" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="105" y="145" text-anchor="middle" class="lbl2">Destination URL</text>
  <text x="105" y="162" text-anchor="middle" class="sub2">from the tap</text>

  <!-- 2 canonical id -->
  <rect x="220" y="120" width="170" height="58" rx="10" fill="#f6f7f9" stroke="#98a2b3"/>
  <text x="305" y="145" text-anchor="middle" class="lbl2">Reduce to a key</text>
  <text x="305" y="162" text-anchor="middle" class="sub2">strip params, canonical id</text>

  <!-- 3 match decision -->
  <polygon points="520,149 575,112 630,149 575,186" fill="#fff8e6" stroke="#dc9b00"/>
  <text x="575" y="146" text-anchor="middle" class="lbl2">matches a</text>
  <text x="575" y="162" text-anchor="middle" class="lbl2">configured page?</text>

  <!-- 4a yes -->
  <rect x="690" y="70" width="150" height="58" rx="10" fill="#e9fbf0" stroke="#067647"/>
  <text x="765" y="95" text-anchor="middle" class="lbl2">Return skeleton</text>
  <text x="765" y="112" text-anchor="middle" class="sub2">for that page type</text>

  <!-- 4b no -->
  <rect x="690" y="170" width="150" height="58" rx="10" fill="#fde7e7" stroke="#b42318"/>
  <text x="765" y="195" text-anchor="middle" class="lbl2">Return nil</text>
  <text x="765" y="212" text-anchor="middle" class="sub2">grey fallback, as before</text>

  <!-- edges -->
  <path class="edge2" d="M180,149 L218,149"/>
  <path class="edge2" d="M390,149 L518,149"/>
  <path class="edge2" d="M630,135 L688,104"/>
  <text x="662" y="110" text-anchor="middle" class="et2">yes</text>
  <path class="edge2" d="M630,163 L688,194"/>
  <text x="662" y="190" text-anchor="middle" class="et2">no</text>
</svg>
