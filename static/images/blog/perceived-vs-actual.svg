<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="330" rx="16" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="430" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#101828">Same measured time. Very different felt wait.</text>

  <!-- shared "real content ready" marker -->
  <line x1="670" y1="70" x2="670" y2="270" stroke="#2f6fed" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="670" y="292" text-anchor="middle" font-size="12" fill="#2f6fed" font-weight="600">real content ready</text>
  <text x="670" y="308" text-anchor="middle" font-size="11" fill="#667085">(identical on both)</text>

  <!-- Row 1: blank -->
  <text x="40" y="112" font-size="15" font-weight="600" fill="#b42318">Blank screen</text>
  <rect x="150" y="92" width="520" height="34" rx="6" fill="#f2f4f7" stroke="#d0d5dd"/>
  <rect x="150" y="92" width="520" height="34" rx="6" fill="#fde7e7"/>
  <text x="410" y="114" text-anchor="middle" font-size="13" fill="#b42318">empty, anxious wait — the whole time feels slow</text>

  <!-- Row 2: skeleton -->
  <text x="40" y="200" font-size="15" font-weight="600" fill="#067647">Skeleton</text>
  <rect x="150" y="180" width="520" height="34" rx="6" fill="#f2f4f7" stroke="#d0d5dd"/>
  <rect x="150" y="180" width="70" height="34" rx="6" fill="#d1fadf"/>
  <text x="185" y="202" text-anchor="middle" font-size="11" fill="#067647">shape</text>
  <rect x="220" y="180" width="450" height="34" rx="0" fill="#eafaf0"/>
  <text x="445" y="202" text-anchor="middle" font-size="13" fill="#067647">waiting, but it reads as progress</text>

  <text x="430" y="252" text-anchor="middle" font-size="13" fill="#667085">The backend call did not get faster. What changed is what the customer looked at while it ran.</text>
</svg>
