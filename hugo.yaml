  about:
    enable: true
    title: "About Me"
    content: |
      I am a senior iOS engineer with 14+ years building high-traffic,
      customer-facing apps in Swift and Objective-C, and the backend services
      that power them.

      At Amazon I build for the emerging market: the top-of-app navigation
      that routes millions of shoppers to Amazon Pay, Amazon Now, and Bazaar,
      native skeleton-loading that measurably improved perceived performance,
      and the AWS services and data pipelines behind the Shopping Aids
      Platform. I recently led the client integration of a machine-learning
      ranking model that personalized the navigation surface per customer.

      I take features from architecture through to launch and measurement, I
      treat performance as something you prove against a control rather than
      claim, and I enjoy mentoring the engineers around me.
    skills:
      enable: true
      title: "A few technologies I work with:"
      items:
        - "Swift / Objective-C"
        - "UIKit & SwiftUI"
        - "Swift Concurrency"
        - "VIPER / MVVM"
        - "Core Data"
        - "Performance profiling (Instruments)"
        - "A/B experimentation"
        - "ML ranking integration"
        - "AWS (DynamoDB, Lambda, CloudWatch)"
        - "Streaming data pipelines"
        - "CI/CD"
        - "Mentorship"

  experience:
    enable: true
    title: "Experience"
    items:
      - job: "Software Development Engineer (iOS & Backend)"
        company: "Amazon"
        companyUrl: "https://www.amazon.com"
        date: "Sep 2022 - Present"
        info:
          enable: true
          content: "Bangalore, India & Berlin, Germany"
        content: |
          - Build the top-of-app navigation for Amazon's shopping app, used by millions of shoppers for quick access to Amazon Pay, Amazon Now, and Bazaar, in a large-scale production environment.
          - Designed and shipped native skeleton-loading that improved perceived performance by roughly 24% on a large multi-marketplace A/B experiment, with no regression in interactivity.
          - Led the client integration of a machine-learning ranking model that personalized the navigation surface per customer for the first time, owning the cold-start strategy and the correctness of the engagement signal it learns from.
          - Design, build, and operate server-side and middleware services on AWS (DynamoDB, Lambda, CloudWatch) with streaming data pipelines into a data lake.
          - Expanded the navigation platform across multiple marketplaces with a reusable rollout runbook, and mentor engineers through code and design reviews.
      - job: "Senior Software Engineer (iOS)"
        company: "Immobilien Scout GmbH"
        date: "Jan 2018 - Aug 2022"
        info:
          enable: true
          content: "Berlin, Germany"
        content: |
          - Ensured performance, quality, and responsiveness of production iOS applications.
          - Set up and maintained CI/CD pipelines for mobile builds and releases.
          - Fixed bottlenecks and defects; contributed to hiring, onboarding, and mentoring.
      - job: "iOS Developer"
        company: "Bonial International GmbH"
        date: "Aug 2016 - Dec 2017"
        info:
          enable: true
          content: "Berlin, Germany"
        content: |
          - Implemented the data sync feature and built features using the VIPER architecture.
          - Wrote unit tests covering edge cases and reliability; fixed bottlenecks and defects.
      - job: "Software Engineer (iOS)"
        company: "VMware"
        date: "Nov 2014 - Jul 2016"
        info:
          enable: true
          content: "India"
        content: |
          - Developed advanced iOS applications; shipped features with cross-functional teams.
          - Unit-tested for robustness; worked on defect resolution and performance.
      - job: "Software Engineer (iOS)"
        company: "Robosoft Technologies"
        date: "Jun 2011 - Nov 2014"
        info:
          enable: true
          content: "India"
        content: |
          - Built and shipped iOS features; ensured performance, quality, and responsiveness.
          - Contributed to WWF Together, an iOS app recognized with the 2013 Apple Design Award.

