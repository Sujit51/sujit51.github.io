  about:
    enable: true
    title: "About Me"
    content: |
      I am a software engineer with over 14 years of experience building
      high-traffic iOS applications and the backend services behind them.

      At Amazon I build for the Indian emerging market: the top-of-app
      navigation surface that routes millions of shoppers to Amazon Pay,
      Amazon Now, and Bazaar, native skeleton-loading that improved
      perceived performance across high-traffic surfaces, and the backend
      and data pipelines of the Shopping Aids Platform.

      I care about performance, reliability, and craft at scale, and I enjoy
      mentoring the engineers around me.
    skills:
      enable: true
      title: "A few technologies I work with:"
      items:
        - "Swift / Objective-C"
        - "UIKit & SwiftUI"
        - "VIPER / MVVM"
        - "AWS (DynamoDB, Lambda, CloudWatch)"
        - "Coral service framework"
        - "Data pipelines (DynamoDB Streams, Andes)"
        - "A/B testing (Weblab)"
        - "CI/CD"

  experience:
    enable: true
    title: "Experience"
    items:
      - job: "Software Development Engineer (iOS & Backend)"
        company: "Amazon"
        companyUrl: "https://www.amazon.com"
        date: "Sep 2022 - Present"
        info:
          enable: true
          content: "Bangalore, India & Berlin, Germany"
        content: |
          - Engineer iOS components for Amazon India's high-traffic top-navigation surface (Amazon Pay, Now, Bazaar) in a large-scale production environment.
          - Led native skeleton-loading in the Amazon shopping app, improving perceived performance across high-traffic surfaces.
          - Design, build, and operate backend/middleware services for the Shopping Aids Platform (Coral service, DynamoDB impression store, DynamoDB Streams to the Andes data lake).
          - Integrate A/B testing (Weblab), platform detection, and multi-language localization; mentor engineers through code reviews.
      - job: "Senior Software Engineer (iOS)"
        company: "Immobilien Scout GmbH"
        date: "Jan 2018 - Aug 2022"
        info:
          enable: true
          content: "Berlin, Germany"
        content: |
          - Ensured performance, quality, and responsiveness of production iOS applications.
          - Set up and maintained CI/CD pipelines for mobile builds and releases.
          - Fixed bottlenecks and defects; contributed to hiring, onboarding, and mentoring.
      - job: "iOS Developer"
        company: "Bonial International GmbH"
        date: "Aug 2016 - Dec 2017"
        info:
          enable: true
          content: "Berlin, Germany"
        content: |
          - Implemented the data sync feature and built features using the VIPER architecture.
          - Wrote unit tests covering edge cases and reliability; fixed bottlenecks and defects.
      - job: "Software Engineer (iOS)"
        company: "VMware"
        date: "Nov 2014 - Jul 2016"
        info:
          enable: true
          content: "India"
        content: |
          - Developed advanced iOS applications; shipped features with cross-functional teams.
          - Unit-tested for robustness; worked on defect resolution and performance.
      - job: "Software Engineer (iOS)"
        company: "Robosoft Technologies"
        date: "Jun 2011 - Nov 2014"
        info:
          enable: true
          content: "India"
        content: |
          - Built and shipped iOS features; ensured performance, quality, and responsiveness.
          - Contributed to WWF Together, an iOS app recognized with the 2013 Apple Design Award.

